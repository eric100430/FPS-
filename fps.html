<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPS 理由伯 - 輸球甩鍋產生器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-purple: #b026ff;
            --neon-green: #00ffcc;
            --dark-bg: #0b0c10;
        }
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--dark-bg);
            /* Cyberpunk grid background */
            background-image: 
                linear-gradient(rgba(0, 255, 204, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 204, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            background-position: center center;
            overflow-x: hidden;
        }

        .neon-text-purple {
            color: #fff;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px var(--neon-purple),
                0 0 40px var(--neon-purple);
        }

        .neon-border-card {
            background: rgba(17, 18, 24, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(176, 38, 255, 0.3);
            box-shadow: 
                0 0 15px rgba(176, 38, 255, 0.1),
                inset 0 0 20px rgba(176, 38, 255, 0.05);
            transition: box-shadow 0.3s ease-in-out, border-color 0.3s ease-in-out;
        }

        .neon-border-card:hover {
            border-color: rgba(0, 255, 204, 0.5);
            box-shadow: 
                0 0 25px rgba(0, 255, 204, 0.2),
                inset 0 0 20px rgba(0, 255, 204, 0.1);
        }

        .btn-neon-green {
            background: transparent;
            color: var(--neon-green);
            border: 2px solid var(--neon-green);
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.3), inset 0 0 10px rgba(0, 255, 204, 0.1);
            transition: all 0.2s ease-in-out;
        }

        .btn-neon-green:hover, .btn-neon-green:active {
            background: var(--neon-green);
            color: var(--dark-bg);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.6), inset 0 0 15px rgba(0, 255, 204, 0.4);
            transform: translateY(-2px);
        }

        .btn-neon-purple {
            background: transparent;
            color: #d884ff;
            border: 2px solid #b026ff;
            box-shadow: 0 0 10px rgba(176, 38, 255, 0.3), inset 0 0 10px rgba(176, 38, 255, 0.1);
            transition: all 0.2s ease-in-out;
        }

        .btn-neon-purple:hover, .btn-neon-purple:active {
            background: var(--neon-purple);
            color: #fff;
            box-shadow: 0 0 20px rgba(176, 38, 255, 0.6), inset 0 0 15px rgba(176, 38, 255, 0.4);
            transform: translateY(-2px);
        }

        .excuse-text {
            opacity: 0;
            transform: translateY(10px);
        }

        .fade-in-up {
            animation: fadeInUp 0.5s forwards ease-out;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: rgba(0, 255, 204, 0.9);
            color: var(--dark-bg);
            text-align: center;
            border-radius: 8px;
            padding: 12px;
            position: fixed;
            z-index: 50;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s, visibility 0.3s;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-gray-200 selection:bg-purple-500 selection:text-white">

    <main class="w-full max-w-2xl relative">
        <!-- Glow accents behind the card -->
        <div class="absolute -top-10 -left-10 w-40 h-40 bg-purple-600 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse"></div>
        <div class="absolute -bottom-10 -right-10 w-40 h-40 bg-teal-500 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse" style="animation-delay: 1s;"></div>

        <!-- Main Card -->
        <div class="neon-border-card rounded-3xl p-8 sm:p-12 relative z-10">
            
            <!-- Header section -->
            <div class="text-center mb-10">
                <h1 class="text-4xl sm:text-5xl font-black mb-4 tracking-wider neon-text-purple uppercase">
                    FPS 理由伯
                </h1>
                <p class="text-gray-400 text-sm sm:text-base tracking-wide border-b border-gray-700/50 pb-4 inline-block">
                    「對槍輸絕對不是你的問題，全是環境與隊友的鍋！」
                </p>
            </div>

            <!-- Display Area -->
            <div class="bg-gray-900/80 rounded-2xl p-6 sm:p-10 mb-10 min-h-[160px] flex items-center justify-center border border-gray-800 relative group overflow-hidden">
                <!-- Decorative quote marks -->
                <div class="absolute top-2 left-4 text-6xl text-purple-500/20 font-serif leading-none select-none">"</div>
                <div class="absolute bottom-[-10px] right-4 text-6xl text-teal-500/20 font-serif leading-none select-none">"</div>
                
                <p id="excuse-display" class="text-xl sm:text-2xl text-center font-bold text-gray-100 leading-relaxed excuse-text z-10 w-full">
                    點擊下方按鈕，召喚你的專屬藉口...
                </p>
            </div>

            <!-- Actions Area -->
            <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
                <button id="generate-btn" class="btn-neon-green w-full sm:w-auto px-8 py-4 rounded-xl font-bold text-lg tracking-wider flex items-center justify-center gap-2">
                    <span class="text-2xl">🎲</span> 產生甩鍋藉口
                </button>
                
                <button id="copy-btn" class="btn-neon-purple w-full sm:w-auto px-6 py-4 rounded-xl font-bold text-lg tracking-wider flex items-center justify-center gap-2">
                    <span class="text-xl">📋</span> 複製藉口
                </button>
            </div>
        </div>
    </main>

    <!-- Toast Notification (Replacing default alert) -->
    <div id="toast">✅ 已複製藉口到剪貼簿！</div>

    <script>
        // 預設的 16 個搞笑甩鍋藉口
        const excusesList = [
            "今天滑鼠墊濕度高達 87%，滑鼠阻力太大了。",
            "隊友剛才開麥聲音太小，干擾了我聽聲辨位。",
            "剛才螢幕更新率突然從 240Hz 掉到 239Hz，影響發揮。",
            "我剛才明明打中爆頭線了，絕對是伺服器 Tickrate 的問題！",
            "剛才手感正熱，但冷氣風口直吹把我手指吹發麻了。",
            "我剛才不是送頭，是在幫隊友拉槍線，這叫戰術犧牲！",
            "椅子高度剛才沒調整好，少了 0.5 公分。",
            "我的 1500R 曲面螢幕剛才反光了一下，不然絕對秒殺他！",
            "這場的隨機數生成絕對有問題，不符合我跑回測模型的常態分佈！",
            "昨晚寫 GTD 筆記寫太多，今天點擊滑鼠的食指疲勞了。",
            "一定是這雙亞瑟士籃球鞋抓地力太好，害我在現實中扭了一下沒點到左鍵！",
            "昨天微積分算太晚，大腦運算神經跟不上準星的軌跡了。",
            "剛才 ASUS 筆電風扇轉太大聲，蓋過了對面的腳步聲！",
            "我正在腦中計算這顆煙霧彈的拋物線，對面不講武德直接拉出來！",
            "麥當勞歡樂送剛好送到，我的心繫著那包大薯，沒心對槍啦！",
            "剛才這波操作，如果在《孤獨搖滾！》的二次元世界裡我已經反殺了，可惜這裡是現實。"
        ];

        // 取得 DOM 元素
        const displayElement = document.getElementById('excuse-display');
        const generateBtn = document.getElementById('generate-btn');
        const copyBtn = document.getElementById('copy-btn');
        const toast = document.getElementById('toast');
        
        let currentExcuse = "";

        function generateExcuse() {
            // 隨機選擇藉口
            const randomIndex = Math.floor(Math.random() * excusesList.length);
            const selectedExcuse = excusesList[randomIndex];
            
            // 如果剛好抽到跟畫面上相同的，再抽一次避免看起來沒動
            if(selectedExcuse === currentExcuse && currentExcuse !== "") {
                return generateExcuse(); 
            }

            currentExcuse = selectedExcuse;

            // 移除動畫 Class 以便重新觸發
            displayElement.classList.remove('fade-in-up');
            
            // 強制瀏覽器重繪 (Reflow)，這樣重新加入 class 才會觸發動畫
            void displayElement.offsetWidth;
            
            // 更新文字並加上動畫
            displayElement.textContent = currentExcuse;
            displayElement.classList.add('fade-in-up');
        }

        function copyToClipboard() {
            const textToCopy = displayElement.textContent.trim();
            
            // 避免使用者一開始還沒生成就按複製
            if(textToCopy === "點擊下方按鈕，召喚你的專屬藉口...") {
                showToast("⚠️ 請先產生一個藉口！", true);
                return;
            }

            // 使用 document.execCommand 作為最穩定的備案 (特別是在 Iframe 環境下)
            const textArea = document.createElement("textarea");
            textArea.value = textToCopy;
            // 將 textarea 移出畫面
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            textArea.style.top = "-999999px";
            document.body.appendChild(textArea);
            
            textArea.focus();
            textArea.select();

            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast("📋 已複製！快貼給隊友看！");
                } else {
                    showToast("❌ 複製失敗，請手動選取複製", true);
                }
            } catch (err) {
                console.error('Fallback: Oops, unable to copy', err);
                showToast("❌ 複製失敗，請手動選取複製", true);
            }

            document.body.removeChild(textArea);
        }

        let toastTimeout;
        function showToast(message, isError = false) {
            toast.textContent = message;
            
            // 根據是否為錯誤調整樣式
            if(isError) {
                toast.style.backgroundColor = "rgba(255, 77, 77, 0.9)";
                toast.style.color = "white";
                toast.style.boxShadow = "0 0 15px rgba(255, 77, 77, 0.5)";
            } else {
                toast.style.backgroundColor = "rgba(0, 255, 204, 0.9)";
                toast.style.color = "var(--dark-bg)";
                toast.style.boxShadow = "0 0 15px rgba(0, 255, 204, 0.5)";
            }

            toast.classList.add("show");

            // 清除之前的計時器，避免快速點擊時閃爍
            clearTimeout(toastTimeout);
            
            // 2.5秒後隱藏
            toastTimeout = setTimeout(() => {
                toast.classList.remove("show");
            }, 2500);
        }

        // 綁定事件監聽器
        generateBtn.addEventListener('click', generateExcuse);
        copyBtn.addEventListener('click', copyToClipboard);

        // 初始化：預設先顯示提示文字動畫
        displayElement.classList.add('fade-in-up');

    </script>
</body>
</html>
